<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao sistema | Palladares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="painel-body login-pagina">
    <main class="login-caixa">
        <div class="marca-painel"><small>PIZZARIA</small><strong>Palladares</strong><span>✦ DESDE 1998 ✦</span></div>
        <h1>Acesso ao sistema</h1>
        <p class="texto-secundario">Entre para acessar o painel da pizzaria.</p>
        <form id="formLogin">
            <div class="campo-painel">
                <label for="nomeLogin">Seu nome</label>
                <input id="nomeLogin" type="text" placeholder="Digite seu nome" required>
            </div>
            <div class="campo-painel">
                <label for="perfilLogin">Perfil de acesso</label>
                <select id="perfilLogin" required>
                    <option value="">Selecione seu perfil</option>
                    <option value="Administrador">Administrador geral</option>
                    <option value="Cozinheiro">Cozinheiro</option>
                    <option value="Atendente">Atendente</option>
                </select>
            </div>
            <button class="botao-painel" type="submit">Entrar no painel</button>
        </form>
        <div class="aviso-demo">Demonstração visual: este acesso ainda não possui senha nem autenticação em servidor. A seleção de perfil serve para testar a navegação entre as telas.</div>
    </main>
</body>
</html>
